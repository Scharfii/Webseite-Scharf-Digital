<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Formulargeruest</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<!-- Geruest fuer die Formularerkennung von Netlify. Diese Datei wird nie
     besucht; sie stellt nur sicher, dass Netlify das Formular "anfrage"
     samt Feldnamen beim Ausliefern findet. -->
<form name="anfrage" netlify data-netlify="true" data-netlify-honeypot="website_url" action="/danke/" method="POST" hidden>
<input type="hidden" name="form-name" value="anfrage">
<input type="text" name="firma">
<input type="text" name="ort">
<input type="url" name="webseite">
<input type="text" name="kontakt">
<input type="text" name="website_url">
<input type="checkbox" name="einwilligung" value="ja">
<button type="submit">Senden</button>
</form>
</body>
</html>
