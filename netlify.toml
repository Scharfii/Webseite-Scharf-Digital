# Scharf Digital — Netlify-Konfiguration.
# Kein Build-Schritt: die Dateien liegen fertig im Repository und werden
# unveraendert ausgeliefert. Die .htaccess im Projekt ist nur relevant,
# falls die Seite spaeter auf einen Apache-Hoster umzieht.

[build]
  publish = "."

# Das PHP-Formular laeuft auf Netlify nicht und soll auch nicht als Text
# abrufbar sein. Es bleibt im Repository, falls spaeter ein PHP-Hoster kommt.
[[redirects]]
  from = "/kontakt.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.htaccess"
  to = "/404.html"
  status = 404

# Interne Unterlagen liegen im Repository, gehoeren aber nicht auf die Webseite.
[[redirects]]
  from = "/LIVEGANG.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/VERARBEITUNGSVERZEICHNIS.md"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Die Seite laedt ausschliesslich eigene Dateien. 'unsafe-inline' nur fuer
    # style-Attribute im HTML, Skripte brauchen es nicht.
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
